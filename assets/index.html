<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <meta name="theme-color" content="#155eef">
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:22px 14px 40px}h1{margin:0 0 6px;font-size:clamp(1.7rem,8vw,2.4rem)}.sub{margin:0 0 20px;color:#647089}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid #e4e8f0;border-radius:16px;box-shadow:0 6px 20px #243b5310}.card{padding:16px}.label{font-size:.75rem;color:#667085;text-transform:uppercase;letter-spacing:.05em}.value{font-size:1.4rem;font-weight:750;margin-top:6px}.panel{padding:15px;margin-top:16px}.form{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:10px;align-items:end}.expense-form{grid-template-columns:1.6fr 1fr 1fr .85fr auto}label{font-size:.86rem;font-weight:650;display:grid;gap:6px}input,select{border:1px solid #ccd3df;border-radius:9px;padding:11px 12px;font:inherit;color:inherit;width:100%;background:#fff}button{border:0;border-radius:9px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;background:#2f6fed;color:#fff}button.secondary{background:#edf2fb;color:#29456f}button.danger{background:#fff0f0;color:#b42318;padding:7px 10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}.expense-toolbar{align-items:flex-start}.expense-search{display:flex;gap:8px;align-items:center}.expense-search input{width:180px;min-width:0}.expense-search input[type=month]{width:145px}.expense-search button{white-space:nowrap}.expense-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.expense-total{white-space:nowrap;color:#29456f;background:#edf2fb;border-radius:9px;padding:10px 12px;font-weight:700}#tabs{justify-content:flex-end}#tabs .secondary{background:#2f6fed;color:#fff}#summary.hidden{display:grid!important;visibility:hidden}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters input{min-width:190px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 8px;border-bottom:1px solid #edf0f5}th{font-size:.8rem;color:#667085;text-transform:uppercase}td:last-child,th:last-child{text-align:right}.empty{text-align:center;color:#667085;padding:30px}.actions{display:flex;justify-content:flex-end;gap:6px}.notice{font-size:.85rem;color:#667085;margin:12px 0 0}.login{position:fixed;inset:0;background:#f5f7fb;display:grid;place-items:center;padding:20px;z-index:5}.login-card{background:#fff;width:min(100%,380px);padding:25px;border-radius:18px;box-shadow:0 8px 30px #243b5320}.login-card h2{margin:0 0 6px}.login-card p{color:#667085}.login-card form{display:grid;gap:12px}.error{color:#b42318;min-height:20px}.hidden{display:none!important}@media(max-width:750px){.grid{grid-template-columns:1fr}.form,.expense-form{grid-template-columns:1fr}.form label:first-child{grid-column:auto}.form button{grid-column:auto;width:100%}.toolbar,.filters{display:grid;grid-template-columns:1fr;width:100%}.expense-toolbar{display:flex;align-items:flex-start}.expense-tools{width:100%}.expense-search{flex:1;width:100%}.expense-search input{flex:1;width:auto}.expense-total{width:100%;text-align:center}#tabs{display:flex;justify-content:flex-end}.filters button{width:100%}.panel{overflow:auto}table{min-width:680px}}
    #summary.hidden{display:none!important;visibility:visible}
  </style>
</head>
<body>
  <section class="login" id="login"><div class="login-card"><h2>Controle</h2><p>Digite sua senha para acessar seus dados.</p><form id="loginForm"><input id="password" type="password" placeholder="Senha" required><button>Entrar</button><div class="error" id="loginError"></div></form><button class="secondary" id="resetBtn" type="button">Redefinir senha</button></div></section>
  <main class="wrap">
    <h1>Controle</h1>
    <p class="sub"></p>
    <section class="grid" id="summary" aria-label="Resumo mensal"></section>
    <section class="grid hidden" id="expenseSummary" aria-label="Resumo de gastos"></section>
    <div class="toolbar" id="tabs"><button id="clientsTab">Clientes</button><button class="secondary" id="expensesTab">Meus gastos</button></div>
    <div id="clientsArea">
    <section class="panel">
      <form id="form" class="form">
        <label>Nome do cliente<input id="name" required placeholder="Ex.: Empresa Alfa"></label>
        <label>Data de recebimento<input id="date" type="date" required></label>
        <label>Valor a receber<input id="amount" type="number" min="0" step="0.01" required placeholder="0,00"></label>
        <button id="save" type="submit">Adicionar</button>
      </form>
      <p class="notice">Os registros são salvos automaticamente neste navegador.</p>
    </section>
    </div>
    <div id="expensesArea" class="hidden">
      <section class="panel"><form id="expenseForm" class="form expense-form"><label>Descrição do gasto<input id="expenseName" required placeholder="Ex.: Combustível"></label><label>Data do gasto<input id="expenseDate" type="date" required></label><label>Valor da parcela<input id="expenseAmount" type="number" min="0" step="0.01" required placeholder="0,00"></label><label>Parcelas<select id="expenseInstallments"><option value="1">À vista</option><option value="2">2 parcelas</option><option value="3">3 parcelas</option><option value="4">4 parcelas</option><option value="5">5 parcelas</option><option value="6">6 parcelas</option><option value="7">7 parcelas</option><option value="8">8 parcelas</option><option value="9">9 parcelas</option><option value="10">10 parcelas</option><option value="11">11 parcelas</option><option value="12">12 parcelas</option><option value="13">13 parcelas</option><option value="14">14 parcelas</option><option value="15">15 parcelas</option><option value="16">16 parcelas</option><option value="17">17 parcelas</option><option value="18">18 parcelas</option><option value="19">19 parcelas</option><option value="20">20 parcelas</option><option value="21">21 parcelas</option><option value="22">22 parcelas</option><option value="23">23 parcelas</option><option value="24">24 parcelas</option><option value="25">25 parcelas</option><option value="26">26 parcelas</option><option value="27">27 parcelas</option><option value="28">28 parcelas</option><option value="29">29 parcelas</option><option value="30">30 parcelas</option><option value="31">31 parcelas</option><option value="32">32 parcelas</option><option value="33">33 parcelas</option><option value="34">34 parcelas</option><option value="35">35 parcelas</option><option value="36">36 parcelas</option><option value="37">37 parcelas</option><option value="38">38 parcelas</option><option value="39">39 parcelas</option><option value="40">40 parcelas</option><option value="41">41 parcelas</option><option value="42">42 parcelas</option><option value="43">43 parcelas</option><option value="44">44 parcelas</option><option value="45">45 parcelas</option><option value="46">46 parcelas</option><option value="47">47 parcelas</option><option value="48">48 parcelas</option><option value="49">49 parcelas</option><option value="50">50 parcelas</option><option value="51">51 parcelas</option><option value="52">52 parcelas</option><option value="53">53 parcelas</option><option value="54">54 parcelas</option><option value="55">55 parcelas</option><option value="56">56 parcelas</option><option value="57">57 parcelas</option><option value="58">58 parcelas</option><option value="59">59 parcelas</option><option value="60">60 parcelas</option></select></label><button id="expenseSave" type="submit">Adicionar</button></form></section>
      <section class="panel"><div class="toolbar expense-toolbar"><strong>Gastos lançados</strong><div class="expense-tools"><form id="expenseSearchForm" class="expense-search"><input id="expenseSearch" placeholder="Buscar gasto..." aria-label="Buscar gasto"><input id="expenseMonth" type="month" aria-label="Filtrar por mês" title="Filtrar por mês"><button type="submit">Pesquisar</button><button id="expenseClear" class="secondary" type="button">Limpar</button></form><span class="expense-total" id="expenseTotal">Total: R$ 0,00</span></div></div><table><thead><tr><th>Descrição</th><th>Data</th><th>Valor da parcela</th><th>Parcela</th><th>Ações</th></tr></thead><tbody id="expenseRows"></tbody></table><div class="empty" id="expenseEmpty">Nenhum gasto cadastrado.</div></section>
    </div>
    <section class="panel" id="clientLaunch">
      <div class="toolbar expense-toolbar"><strong>Lançamentos</strong><div class="expense-tools"><form id="clientSearchForm" class="expense-search"><input id="search" placeholder="Buscar cliente..." aria-label="Buscar cliente"><input id="clientMonth" type="month" aria-label="Filtrar clientes por mês" title="Filtrar por mês"><button type="submit">Pesquisar</button><button id="clientClear" class="secondary" type="button">Limpar</button></form><span class="expense-total" id="clientTotal">Total: R$ 0,00</span></div></div>
      <table><thead><tr><th>Cliente</th><th>Data</th><th>Valor</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table>
      <div class="empty" id="empty">Nenhum lançamento cadastrado.</div>
    </section>
  </main>
  <script>
    let items=[], expenses=[], editing=null, expenseEditing=null, expenseQuery='', expenseMonth='', expenseFilterApplied=false, clientQuery='', clientMonth='', clientFilterApplied=false;
    const $=id=>document.getElementById(id), isValidDateValue=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T00:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===v}, money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v), dateFmt=v=>isValidDateValue(v)?new Intl.DateTimeFormat('pt-BR',{timeZone:'UTC'}).format(new Date(v+'T00:00:00')):'Data inválida';
    const localToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const intValue=(value,fallback=1)=>{const n=Number(value);return Number.isInteger(n)&&n>0?n:fallback};
    const installmentCount=x=>Math.min(60,intValue(x.installments,1));
    const installmentNumber=x=>Math.min(installmentCount(x),intValue(x.installment,1));
    const installmentCents=x=>Math.max(0,Math.round(Number(x.amount)*100));
    const installmentAmount=x=>installmentCents(x)/100;
    const installmentLabel=x=>installmentCount(x)>1?`${installmentNumber(x)} de ${installmentCount(x)}`:'À vista';
    function addMonth(value,anchorDay){const d=new Date(value+'T00:00:00Z'),nextMonth=d.getUTCMonth()+1,nextYear=d.getUTCFullYear()+Math.floor(nextMonth/12),month=nextMonth%12,day=Math.min(intValue(anchorDay,d.getUTCDate()),31),last=new Date(Date.UTC(nextYear,month+1,0)).getUTCDate();return new Date(Date.UTC(nextYear,month,Math.min(day,last))).toISOString().slice(0,10)}
    function normalizeExpense(x){const anchorDay=intValue(x.anchorDay,Number(String(x.date||'').slice(8,10))||1);return {...x,installments:installmentCount(x),installment:installmentNumber(x),anchorDay}}
    async function save(){const r=await fetch('/api/items',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(items)});if(!r.ok)alert('Não foi possível salvar os dados.');render()}
    function rollForward(){const today=localToday();let changed=false;items.forEach(x=>{const anchorDay=intValue(x.anchorDay,Number(String(x.date||'').slice(8,10))||1);if(x.anchorDay!==anchorDay){x.anchorDay=anchorDay;changed=true}while(x.date<today){x.date=addMonth(x.date,anchorDay);changed=true}});return changed}
    function rollExpensesForward(){const today=localToday();let changed=false;expenses.forEach(x=>{const total=installmentCount(x),current=installmentNumber(x),anchorDay=intValue(x.anchorDay,Number(String(x.date||'').slice(8,10))||1);if(x.installments!==total){x.installments=total;changed=true}if(x.installment!==current){x.installment=current;changed=true}if(x.anchorDay!==anchorDay){x.anchorDay=anchorDay;changed=true}if(total<=1||x.completed)return;while(x.date<today&&x.installment<total){x.date=addMonth(x.date,anchorDay);x.installment++;changed=true}if(x.installment>=total&&x.date<today&&!x.completed){x.completed=true;changed=true}});return changed}
    function render(){const q=clientQuery,m=clientMonth;const view=items.filter(x=>x.name.toLowerCase().includes(q)&&(!m||(isValidDateValue(x.date)&&x.date.slice(0,7)===m))).sort((a,b)=>a.date.localeCompare(b.date));const total=clientFilterApplied?view.filter(x=>isValidDateValue(x.date)).reduce((sum,x)=>sum+Number(x.amount),0):0;const months={};items.filter(x=>isValidDateValue(x.date)).forEach(x=>{const month=x.date.slice(0,7);months[month]=(months[month]||0)+Number(x.amount)});$('clientTotal').textContent=`Total: ${money(total)}`;$('summary').innerHTML=Object.keys(months).sort().map(month=>{const label=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${month}-01T00:00:00`));return `<div class="card"><div class="label">Total previsto do mês de ${label}</div><div class="value">${money(months[month])}</div></div>`}).join('')||'<div class="card"><div class="label">Total previsto</div><div class="value">R$ 0,00</div></div>';$('rows').innerHTML=view.map(x=>`<tr><td>${esc(x.name)}</td><td>${dateFmt(x.date)}</td><td>${money(x.amount)}</td><td><div class="actions"><button class="secondary" onclick="editItem('${x.id}')">Editar</button><button class="danger" onclick="removeItem('${x.id}')">Excluir</button></div></td></tr>`).join('');$('empty').style.display=view.length?'none':'block'}
    function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
    $('form').onsubmit=e=>{e.preventDefault();const record={id:editing||crypto.randomUUID(),name:$('name').value.trim(),date:$('date').value,amount:Number($('amount').value)};if(editing)items=items.map(x=>x.id===editing?record:x);else items.push(record);editing=null;$('form').reset();$('save').textContent='Adicionar';save()};
    window.editItem=id=>{const x=items.find(i=>i.id===id);editing=id;$('name').value=x.name;$('date').value=x.date;$('amount').value=x.amount;$('save').textContent='Salvar edição';window.scrollTo({top:0,behavior:'smooth'})};
    window.removeItem=id=>{if(confirm('Excluir este lançamento?')){items=items.filter(x=>x.id!==id);save()}};
    async function saveExpenses(){const r=await fetch('/api/expenses',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(expenses)});if(!r.ok)alert('Não foi possível salvar os gastos.');renderExpenses()}
    function renderExpenses(){const q=expenseQuery,m=expenseMonth;const view=expenses.filter(x=>x.name.toLowerCase().includes(q)&&(!m||(isValidDateValue(x.date)&&x.date.slice(0,7)===m))).sort((a,b)=>a.date.localeCompare(b.date));const total=expenseFilterApplied?view.filter(x=>isValidDateValue(x.date)).reduce((sum,x)=>sum+installmentAmount(x),0):0;const months={};expenses.filter(x=>isValidDateValue(x.date)).forEach(x=>{const month=x.date.slice(0,7);months[month]=(months[month]||0)+installmentAmount(x)});$('expenseTotal').textContent=`Total: ${money(total)}`;$('expenseSummary').innerHTML=Object.keys(months).length?Object.keys(months).sort().map(month=>{const label=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${month}-01T00:00:00`));return `<div class="card"><div class="label">Total de gastos em ${label}</div><div class="value">${money(months[month])}</div></div>`}).join(''):'<div class="card"><div class="label">Total de gastos</div><div class="value">R$ 0,00</div></div>';$('expenseRows').innerHTML=view.map(x=>`<tr><td>${esc(x.name)}</td><td>${dateFmt(x.date)}</td><td>${money(installmentAmount(x))}</td><td>${x.completed?'Concluída · ':''}${installmentLabel(x)}</td><td><div class="actions"><button class="secondary" onclick="editExpense('${x.id}')">Editar</button><button class="danger" onclick="removeExpense('${x.id}')">Excluir</button></div></td></tr>`).join('');$('expenseEmpty').style.display=view.length?'none':'block'}
    $('expenseForm').onsubmit=e=>{e.preventDefault();const date=$('expenseDate').value;if(!isValidDateValue(date)){alert('Informe uma data válida para o gasto.');return}const existing=expenseEditing?expenses.find(x=>x.id===expenseEditing):null,total=Number($('expenseAmount').value),installments=intValue($('expenseInstallments').value,1),record={id:expenseEditing||crypto.randomUUID(),name:$('expenseName').value.trim(),date,amount:total,installments,installment:existing?Math.min(installments,installmentNumber(existing)):1,anchorDay:Number(date.slice(8,10))||1,completed:Boolean(existing?.completed)};expenses=expenseEditing?expenses.map(x=>x.id===expenseEditing?record:x):[...expenses,record];expenseEditing=null;$('expenseForm').reset();$('expenseSave').textContent='Adicionar';saveExpenses()};window.editExpense=id=>{const x=expenses.find(i=>i.id===id);expenseEditing=id;$('expenseName').value=x.name;$('expenseDate').value=isValidDateValue(x.date)?x.date:'';$('expenseAmount').value=x.amount;$('expenseInstallments').value=installmentCount(x);$('expenseSave').textContent='Salvar edição';window.scrollTo({top:0,behavior:'smooth'})};window.removeExpense=id=>{if(confirm('Excluir este gasto?')){expenses=expenses.filter(x=>x.id!==id);saveExpenses()}};
    $('clientsTab').onclick=()=>{$('clientsArea').classList.remove('hidden');$('clientLaunch').classList.remove('hidden');$('summary').classList.remove('hidden');$('expenseSummary').classList.add('hidden');$('expensesArea').classList.add('hidden');render()};$('expensesTab').onclick=()=>{$('clientsArea').classList.add('hidden');$('clientLaunch').classList.add('hidden');$('summary').classList.add('hidden');$('expenseSummary').classList.remove('hidden');$('expensesArea').classList.remove('hidden');renderExpenses()};$('expenseSearchForm').onsubmit=e=>{e.preventDefault();expenseQuery=$('expenseSearch').value.trim().toLowerCase();expenseMonth=$('expenseMonth').value;expenseFilterApplied=Boolean(expenseQuery||expenseMonth);renderExpenses()};$('expenseClear').onclick=()=>{expenseQuery='';expenseMonth='';expenseFilterApplied=false;$('expenseSearch').value='';$('expenseMonth').value='';renderExpenses()};$('clientSearchForm').onsubmit=e=>{e.preventDefault();clientQuery=$('search').value.trim().toLowerCase();clientMonth=$('clientMonth').value;clientFilterApplied=Boolean(clientQuery||clientMonth);render()};$('clientClear').onclick=()=>{clientQuery='';clientMonth='';clientFilterApplied=false;$('search').value='';$('clientMonth').value='';render()};
    async function load(){const [a,b]=await Promise.all([fetch('/api/items'),fetch('/api/expenses')]);if(a.status===401)return;items=await a.json();expenses=(await b.json()).map(normalizeExpense);if(rollForward())await save();if(rollExpensesForward())await saveExpenses();render();renderExpenses()}
    $('loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('password').value})});if(r.ok){$('login').classList.add('hidden');load()}else $('loginError').textContent='Senha inválida.'};
    $('resetBtn').onclick=async()=>{const old=prompt('Senha atual:');const next=prompt('Nova senha:');if(old&&next){const r=await fetch('/api/password',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({oldPassword:old,newPassword:next})});alert(r.ok?'Senha redefinida.':'Senha atual inválida.')}};
    fetch('/api/session').then(r=>{if(r.ok){$('login').classList.add('hidden');load()}});
  </script>
</body>
</html>
